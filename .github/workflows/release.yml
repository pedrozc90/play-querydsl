name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - uses: actions/cache@v6
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
            ~/.cache/coursier
          key: sbt-${{ hashFiles('**/*.sbt', '**/build.properties') }}

      - name: Check formatting
        run: |
          scalafmt --check
          sbt javafmtCheck

      - name: Scripted tests
        run: sbt scripted

      - name: Publish to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # first release: the gh-pages branch does not exist yet
          if ! git clone --depth 1 --branch gh-pages "$remote" target/gh-pages; then
            git init -b gh-pages target/gh-pages
            git -C target/gh-pages remote add origin "$remote"
            touch target/gh-pages/.nojekyll
          fi
          sbt "set version := \"${GITHUB_REF_NAME#v}\"" publish
          cd target/gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "publish ${GITHUB_REF_NAME}"
          git push origin gh-pages

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes target/scala-2.10/sbt-0.13/*.jar target/scala-2.10/sbt-0.13/*.pom
