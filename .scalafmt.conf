version = "3.11.5"
# closest dialects to the sbt 0.13 / Scala 2.10 toolchain (scalafmt 3 has no scala210)
runner.dialect = scala211
fileOverride {
  "glob:**/*.sbt" { runner.dialect = sbt0137 }
}
maxColumn = 120
indent.main = 4
indent.callSite = 4
indent.defnSite = 4
project.excludePaths = ["glob:**/target/**"]
docstrings.style = keep
docstrings.wrap = no
